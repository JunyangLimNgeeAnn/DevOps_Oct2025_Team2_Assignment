name: DevSecOps Security Pipeline (Strict Mode)

on:
  push:
    branches: [ "devops/test-validation", "feature/auth-service" ]

jobs:
  security-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- 1. SCA: Dependency Scan (Now with Error Flagging) ---
      - name: Run SCA Scan
        working-directory: ./services/frontend
        run: |
          npm install -g npm-audit-html
          # This saves it inside services/frontend/
          npm audit --json | npm-audit-html --output sca-report.html

      # --- 2. SAST: Code Analysis (Strict Mode) ---
      - name: Set up Python for SAST
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Semgrep
        run: python3 -m pip install semgrep

      - name: Run SAST Scan
        run: |
          # We use the explicit output flag with the file extension
          semgrep scan --config auto --output=sast-report.html --html .
      # --- 3. Verification Step (If this fails, the pipeline fails) ---
      - name: Confirm Reports Exist
        run: |
          test -f sast-report.html && echo "SAST Report Found" || (echo "SAST Report MISSING" && exit 1)
          test -f services/frontend/sca-report.html && echo "SCA Report Found" || (echo "SCA Report MISSING" && exit 1)

      # --- 4. Upload Artifacts ---
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-security-evidence
          path: |
            sast-report.html
            services/frontend/sca-report.html