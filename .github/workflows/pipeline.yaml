name: DevSecOps MVP Pipeline (HTML Reports)

on:
  push:
    branches: [ "devops/test-validation"]

jobs:
  qa-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./services/frontend
        run: |
          npm install
          # Install the HTML reporter for tests
          npm install --save-dev jest-html-reporters

      # 1. SECURITY: SCA Scan (Converting JSON to a basic HTML-like log)
      - name: Dependency Scan
        working-directory: ./services/frontend
        run: |
          npm audit > sca-report.txt || true
          echo "<html><body><h1>SCA Audit Report</h1><pre>$(cat sca-report.txt)</pre></body></html>" > sca-report.html

      # 2. TEST: Run Unit Tests with HTML Output
      - name: Run Unit Tests (HTML)
        working-directory: ./services/frontend
        run: |
          npm test -- --reporters=default --reporters=jest-html-reporters
        env:
          JEST_HTML_REPORTERS_OUTPUT_PATH: ./test-report.html

      # 3. ARTIFACTS: Upload the HTML files
      - name: Upload HTML Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-html-reports
          path: |
            services/frontend/sca-report.html
            services/frontend/test-report.html