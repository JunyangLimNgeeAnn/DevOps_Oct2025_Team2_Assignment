name: DevSecOps Security Reporting

on:
  push:
    branches: [ "devops/test-validation", "feature/auth-service" ]

jobs:
  security-scans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. SCA: Dependency Scan (HTML)
      - name: SCA Scan
        working-directory: ./services/frontend
        run: |
          npm install -g npm-audit-html
          npm audit --json | npm-audit-html --output sca-report.html || true

      # 2. SAST: Static Analysis (HTML)
      - name: SAST Scan
        run: |
          python3 -m pip install semgrep
          semgrep scan --config auto --html -o sast-report.html || true

      # 3. Unit Tests (Simple console output, no HTML)
      - name: Run Unit Tests
        working-directory: ./services/frontend
        run: |
          npm test || echo "Tests skipped or failed, continuing to upload security reports..."

      # 4. Artifacts: Upload ONLY the Security HTML files
      - name: Upload Security Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-html-reports
          path: |
            services/frontend/sca-report.html
            sast-report.html