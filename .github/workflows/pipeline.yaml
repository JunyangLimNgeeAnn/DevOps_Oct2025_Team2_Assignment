name: DevSecOps Full Lifecycle Pipeline

on:
  push:
    branches: [ "devops/test-validation", "main" ]

jobs:
  devsecops-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- CODE QUALITY ---
      - name: 3. Run ESLint
        working-directory: ./services/frontend
        run: |
          npm install
          npx eslint . || echo "Linting finished"

      # --- SAST (The core of your scan) ---
      # --- SECURITY STAGE (SAST) ---
      - name: 4. Run SAST (Semgrep)
        run: |
          # 1. We use '--format html' for the new version
          # 2. We use '-o /src/sast-report.html' to save it to the mounted root
          docker run --user root --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan --config auto --format html -o /src/sast-report.html || true
          
          # 3. Check if the file exists on the host runner
          ls -lh sast-report.html || echo "Report file NOT found!"

      # --- SCA (The core of your dependency check) ---
      - name: 5. Run SCA (NPM Audit)
        working-directory: ./services/frontend
        run: |
          npm install -g npm-audit-html
          npm audit --json | npm-audit-html --output sca-report.html || true

      # --- PLANNED STAGES (Simulated for your Plan) ---
      - name: 6. Build & DAST (Placeholders)
        run: |
          echo "Build: Logic mapped. Awaiting Dockerfile."
          echo "DAST: Logic mapped. Awaiting Staging Environment."

      # --- EVIDENCE COLLECTION ---
      - name: 7. Upload Security Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DevSecOps-Quality-Reports
          path: |
            sast-report.html
            services/frontend/sca-report.html